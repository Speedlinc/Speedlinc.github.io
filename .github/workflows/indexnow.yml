name: IndexNow Submit

on:
  push:
    branches: [main]
    paths:
      - '_posts/**'

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed post files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- '_posts/*.md' | head -20)
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Build URL list and submit to IndexNow
        if: steps.changed.outputs.files != ''
        run: |
          KEY="2AA1DA2F0AF2B5EECBB586C93C919C94"
          HOST="speedlinc.github.io"
          BASE="https://$HOST"

          URLS=()
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # 从文件名提取日期和 slug: _posts/YYYY-MM-DD-slug.md
            name=$(basename "$file" .md)
            year=$(echo "$name" | cut -d- -f1)
            month=$(echo "$name" | cut -d- -f2)
            day=$(echo "$name" | cut -d- -f3)
            slug=$(echo "$name" | cut -d- -f4-)
            # URL 必须按 permalink 推导：zh 文章 front matter 没有 permalink，走
            # _config.yml defaults 的 /zh/:year/:month/:day/:title/；小语种文章在
            # front matter 里显式写了自己的 permalink。直接用 /年/月/日/slug/ 会得到 404。
            pl=$(sed -n 's/^permalink:[[:space:]]*//p' "$file" | head -1)
            [ -z "$pl" ] && pl="/zh/:year/:month/:day/:title/"
            pl="${pl//:year/$year}"
            pl="${pl//:month/$month}"
            pl="${pl//:day/$day}"
            pl="${pl//:title/$slug}"
            url="$BASE$pl"
            URLS+=("\"$url\"")
          done <<< "${{ steps.changed.outputs.files }}"

          if [ ${#URLS[@]} -eq 0 ]; then
            echo "No valid URLs to submit."
            exit 0
          fi

          URL_JSON=$(IFS=,; echo "[${URLS[*]}]")

          PAYLOAD=$(cat <<EOF
          {
            "host": "$HOST",
            "key": "$KEY",
            "keyLocation": "$BASE/$KEY.txt",
            "urlList": $URL_JSON
          }
          EOF
          )

          echo "Submitting: $PAYLOAD"

          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD" \
            -w "\nHTTP Status: %{http_code}\n"
